; PHP settings for the Recall API container.
;
; Two jobs only: never tell a caller what interpreter is running, and never
; print an error into a response. Everything else here is a floor that keeps a
; runaway request from taking the box with it.

[PHP]
; The API is a JSON front controller. `expose_php = Off` removes the
; `X-Powered-By` header; api/index.php additionally calls header_remove(),
; because the built-in server (which `npm run dev` uses) emits that header
; itself and ignores this setting from inside a request.
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
error_reporting = E_ALL

; Timestamps are stored as unix milliseconds and dates are rendered in the
; browser's locale, so the server needs no timezone of its own. UTC keeps the
; server's idea of "now" identical to every client's idea of a UTC-based cursor.
date.timezone = UTC

; A request that parses at most REQUEST_MAX_BYTES (1 MiB by default) never
; needs more than this, and a runaway allocation should fail loudly in the log
; rather than be OOM-killed silently.
memory_limit = 128M
max_execution_time = 30
post_max_size = 2M
upload_max_filesize = 2M
default_charset = "UTF-8"

; No sessions, no cookies: identity is a derived key sent in a header, so the
; session machinery is never started and cannot hold state.
session.auto_start = 0

; OPcache is a measurable win for a PHP front controller that re-requires the
; same five files on every request. It is only enabled in the container build;
; a bare `php -S` install still works, just without it.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 64
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 2000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 30
