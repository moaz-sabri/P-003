; Pool for the Recall API.
;
; The container runs this pool as an unprivileged user (uid 10001) with a
; read-only root filesystem and every capability dropped, so the only writable
; path the API has is the `sync-data` volume mounted at /app/api/var.

[global]
; Nothing here is a Unix socket: nginx reaches the pool over the compose
; network as `php:9000`, which is what keeps the two containers on separate
; ports and lets the web container run as an unprivileged nginx.
daemonize = no
error_log = /proc/self/fd/2
log_level = notice

[www]
user = rc
group = rc
listen = 0.0.0.0:9000

; The API is stateless: every request authenticates itself with a derived key
; in a header, so no pool process needs anything carried over from the one
; before it. `clear_env = no` is what keeps DATABASE_PATH and ENVIRONMENT —
; which the Dockerfile sets — visible to the workers; the default (yes) would
; hand php-fpm an environment with none of the application's configuration in
; it, and every request would fall back to the defaults in api/config.php.
clear_env = no

; `ondemand` keeps memory proportional to real traffic, which is the right
; shape for a personal server that is idle most of the day.
pm = ondemand
pm.max_children = 8
pm.process_idle_timeout = 30s
pm.max_requests = 500

; A request that never finishes must not hold a worker forever.
request_terminate_timeout = 40s

; Long enough for a 1 MiB push over a slow link, short enough that a stuck
; worker is replaced within a minute.
slowlog = /proc/self/fd/2
request_slowlog_timeout = 10s
