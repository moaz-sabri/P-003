limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    # NO `index` DIRECTIVE. The served shell is app/dist/index.html, and the
    # docroot also holds app/index.html — the TEMPLATE the build reads, which
    # names no assets and would render an unstyled, dead page. An `index`
    # directive would hand that template out for `/`, so `/` and `/index.html`
    # are answered by exact-match locations further down that name the built
    # file instead.

    # The web manifest needs an explicit type. The base image's mime.types has no
    # entry for .webmanifest, so without this it is served as
    # application/octet-stream — which the browser's install criteria REJECT, so
    # the container deployment could not install as a PWA while the same app
    # installed fine everywhere else.
    #
    # A `types` block REPLACES the inherited map rather than adding to it, so
    # mime.types is re-included here. Dropping that line would break the CSS and
    # JavaScript types and the app would load unstyled.
    types {
        application/manifest+json  webmanifest;
    }
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;
    # Must stay in sync with REQUEST_MAX_BYTES in api/config.php (default 1 MiB =
    # 1048576 bytes). The app enforces the real limit; this only caps what nginx
    # forwards. If REQUEST_MAX_BYTES is raised via env, raise this to match.
    client_max_body_size 1m;
    client_body_timeout 15s;
    # A body larger than client_max_body_size is refused before it is buffered,
    # so this bounds the request line/headers too.
    client_header_timeout 15s;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/manifest+json image/svg+xml;

    # ---------- Security headers ----------
    # These are inherited by every location below because none of them redefines
    # them, and `add_header` in a nested block REPLACES the whole inherited set
    # — so adding a single header inside a location later silently drops all of
    # them. Keep the complete set here.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # object-src is 'none' rather than left to fall back to default-src: the
    # fallback would be 'self', which still permits same-origin plugin content.
    # script-src/style-src stay 'self' with no unsafe-inline — that is why
    # app/js/ui/dom.js routes the `style` prop through CSSOM instead of the
    # style attribute.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    # HSTS is deliberately NOT sent by default. This container listens on plain
    # HTTP :8080, and Strict-Transport-Security is cached by the browser for the
    # max-age given: enabling it here would make every later plain-HTTP request
    # to the same host fail outright, including a local `docker compose up`.
    # Enable it at the TLS terminator (proxy/Cloudflare) or set HSTS_MAX_AGE
    # (api/config.php applies it to the API responses) once HTTPS is real.

    # ---------- API ----------
    location = /api { return 308 /api/; }

    # Every request under /api/ is handed to the ONE front controller, which
    # routes on an exact path match. Nothing under /api/ is ever served as a
    # file, which is what keeps api/var/sync.sqlite, api/tests/*.php and the
    # PHP sources unreachable over HTTP.
    #
    # No `add_header` in this block on purpose: a single add_header inside it
    # REPLACES the whole inherited security-header set above, so all of them
    # would vanish from every API response. The API sends its own
    # `Cache-Control: no-store` from rc_json() on every response, which is the
    # only header this location would have added.
    location ^~ /api/ {
        limit_req zone=api burst=20 nodelay;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/api/index.php;
        fastcgi_param SCRIPT_NAME     /api/index.php;
        fastcgi_pass php:9000;

        fastcgi_read_timeout 30s;
        fastcgi_send_timeout 30s;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
    }

    # ---------- Static ----------
    #
    # CACHE POLICY — the same four rules docker-router.php implements, kept in
    # the same order. The two files have to agree about /dist/, /sw.js, the
    # manifest and the icons, because a deployment that disagrees with itself is
    # a deployment where a fix reaches one server and not the other. The assets
    # are content-hashed now, so a year is correct in both files. Change a rule
    # in one and change it in the other; tests/deploy.test.mjs asserts that they
    # still agree.

    # 1. A content-hashed asset is immutable for a year: the name changes
    #    whenever the bytes do, so there is nothing to revalidate. Matched by
    #    name rather than by prefix so a hand-added /dist/file.js, which has no
    #    hash in it and can therefore change under a stable URL, does not
    #    inherit the year. This regex must stay ABOVE the `location /dist/`
    #    fallback and that fallback must NOT be `^~` — a `^~` prefix stops
    #    nginx evaluating regex locations at all.
    #
    #    THE QUOTES ARE LOAD-BEARING. nginx's configuration parser reads `{` as
    #    the start of a block even inside a `location ~` pattern, so `{8}` in an
    #    unquoted pattern ends the location block early and the rest of the
    #    pattern is read as a directive:
    #
    #      [emerg] unknown directive "8}\.(?:js|css)$" in .../default.conf
    #
    #    and nginx refuses to start at all. Nothing in the repository can see
    #    that — a text test reads the same line happily and the PHP router,
    #    which implements this policy in code, is not nginx — so the quotes are
    #    asserted by tests/deploy.test.mjs, and `nginx -t` inside the image is
    #    the real check. Do not add a hash quantifier to a pattern without them.
    location ~ "^/dist/[^/]*\.[0-9a-f]{8}\.(?:js|css)$" {
        try_files $uri =404;
        expires 1y;
    }

    # 2. Anything else in /dist/ is revalidated, which is the shell: it names
    #    the hashed assets, so a stored copy of it is an app loading an old
    #    bundle. (nginx's `expires -1` sends `Cache-Control: no-cache` rather
    #    than the router's `no-store`; both refuse a stale copy, and no
    #    `add_header` is used here on purpose — see the note above about
    #    inherited security headers being replaced.)
    location = /dist/index.html {
        try_files $uri =404;
        expires -1;              # Cache-Control: no-cache
    }

    location /dist/ {
        try_files $uri =404;
        expires -1;
    }

    location ^~ /icons/ {
        try_files $uri =404;
        expires 30d;
    }

    # The manifest is what installability is judged against, so it is
    # revalidated on every load like the shell.
    location = /manifest.webmanifest {
        try_files $uri =404;
        expires -1;              # Cache-Control: no-cache
    }

    # A cached service worker is one the browser stops re-reading, so a new
    # release's worker never installs.
    location = /sw.js {
        try_files $uri =404;
        expires -1;              # Cache-Control: no-cache
    }

    # 3. The unbuilt sources. They are in the image because the bundle is built
    #    from them, and the shell references nothing under them, so serving
    #    them hands out readable, unminified, unhashed source for nothing. The
    #    router refuses the same two prefixes.
    location ^~ /js/ { return 404; }
    location ^~ /css/ { return 404; }

    # ---------- Hardening ----------
    location ~ /\.(?!well-known) { deny all; }

    # Platform config files that describe the deployment and must never be
    # readable: _headers/_redirects name the security policy, and anything
    # ending in a source or data extension has no business being web-readable.
    location ~ ^/(_headers|_redirects)$ { return 404; }
    location ~* \.(?:sqlite|sqlite3|db|db-wal|db-shm|wal|shm|log|bak|old|orig|sql|env|ini|conf|lock|md|json|yaml|yml|map|ts|tsx|jsx|php|py|sh|pl|cgi|phar|htaccess|htpasswd)$ {
        return 404;
    }

    # ---------- SPA ----------
    #
    # The shell is app/dist/index.html, written by the build (app/index.html is
    # the template and is never served). Every route here names that path and not
    # a root index.html. A 404 means the image was not built: `npm run build`
    # runs in the Dockerfile's build stage, and a missing shell is what that
    # looks like from outside.
    #
    # `expires -1` is written out on all three, deliberately rather than relied
    # upon to be inherited across the internal redirect — and unlike `add_header`,
    # `expires` does not discard the security headers inherited from above.
    location = / {
        try_files /dist/index.html =404;
        expires -1;              # Cache-Control: no-cache
    }

    # Same file, same revalidation — and this is the one location that keeps the
    # template at the docroot root from being served under its own name.
    location = /index.html {
        try_files /dist/index.html =404;
        expires -1;              # Cache-Control: no-cache
    }

    # The catch-all inherits the revalidation from `= /dist/index.html` above.
    location / {
        try_files $uri $uri/ /dist/index.html;
    }
}
