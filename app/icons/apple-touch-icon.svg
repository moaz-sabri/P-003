<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" role="img" aria-label="Recall">
    <!-- iOS applies its own rounding and its own mask to the touch icon, so this
         one is full bleed — a rounded background here would show as a second,
         smaller rounded square inside the system's. -->
    <rect x="0" y="0" width="180" height="180" fill="#141a20"/>
    <path d="M53 94 L80 121 L129 67"
          fill="none"
          stroke="#7cc0ff"
          stroke-width="18"
          stroke-linecap="round"
          stroke-linejoin="round"/>
</svg>
